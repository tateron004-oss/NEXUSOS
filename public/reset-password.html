<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusOS Password Reset</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="intake-body">
  <main class="subscriber-shell">
    <section class="subscriber-hero">
      <div class="mark">NO</div>
      <p class="eyebrow">Subscriber Access</p>
      <h1>Reset your password.</h1>
      <p id="resetMessage">Request a reset link or set a new password.</p>
    </section>
    <form id="requestResetForm" class="intake-form">
      <h2>Request Reset</h2>
      <label>Email<input id="resetEmail" type="email" placeholder="subscriber@example.com"></label>
      <button class="primary" type="submit">Send reset instructions</button>
    </form>
    <form id="confirmResetForm" class="intake-form">
      <h2>Set New Password</h2>
      <label>Reset token<input id="resetToken" placeholder="Token from reset link"></label>
      <label>New password<input id="newPassword" type="password" placeholder="At least 8 characters"></label>
      <button class="primary" type="submit">Update password</button>
    </form>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
